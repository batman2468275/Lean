<h1 class="sr">Colors</h1>
  <section class="chapter colors" id="colors" data-ch="colors" data-tone="dark" style="--h:5">
    <div class="pin">
      <div class="cmeta">
        <p class="eyebrow">Colors</p>
        <p class="copy" id="cmeta-copy"></p>
      </div>
      <div class="pin-in">
        <div class="stack" id="cnames"></div>
      </div>
      <div class="sw-row-wrap" style="position:absolute;left:0;right:0;bottom:max(3.2svh,16px)">
        <div class="sw-row" id="sw-colors" role="group" aria-label="Jump to a color"></div>
      </div>
    </div>
  </section>

<section class="panel" id="pick" data-tone="dark">
  <svg class="wave" viewBox="0 0 1440 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 100V46C180 -6 300 6 430 44C560 82 690 96 830 60C970 24 1090 -4 1220 28C1320 52 1390 56 1440 40V100Z"/></svg>
  <div class="wrap">
    <p class="eyebrow rv">Pick yours</p>
    <h2 class="rv" style="max-width:16ch">Same stand, your color.</h2>
    <div class="swatch-cards" id="color-links"></div>
    <p class="fine rv">Every color is one clean color, printed through. There is no mixing and no custom color.</p>
  </div>
</section>
